name = "jerseyflow-api-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "jerseyflow_production_jwt_secret_key_2026"
DEFAULT_UPI_ID = "jerseyflow@upi"
STORE_NAME = "JerseyFlow Store"
WHATSAPP_VERIFY_TOKEN = "jerseyflow_webhook_secret"

[[d1_databases]]
binding = "DB"
database_name = "jerseyflow-db"
database_id = "e4ce34ae-fe12-46ec-9fb8-6366ee38e5f8"

# R2 bucket can be enabled in Cloudflare Dashboard
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "jerseyflow-media"
