name = "jerseyflow-api-worker-prod"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "jerseyflow-db-prod"
database_id = "production-d1-uuid-here"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "jerseyflow-media-prod"
